# GR-D9 (greenrepo DEP-02, UPK-01): the dependencies kept current — Bun's packages and the workflows' actions, each
# ecosystem's updates grouped into one pull request a month, merged on the upkeep calendar (MAINTAINING.md). A version
# is proposed only once it's a week old, as bunfig.toml's minimumReleaseAge and the actions' pins have it (14.10).
# Security updates are Dependabot's alerts', opened at once, apart from these. Titles are Conventional Commits
# (`build(deps): …`, `ci(deps): …`), as a pull request's must be (GR-D6).
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    # The example projects (examples/) are fixtures the tests read, never installed: never updated either.
    exclude-paths: ["examples/**"]
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    # web-tree-sitter is the one OpenTUI names as its peer: it moves with OpenTUI, by hand, never ahead of it.
    ignore:
      - dependency-name: web-tree-sitter
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      # OpenTUI in a pull request of its own: its upgrade policy (blueprint/design/how-it-works.md) has the TUI tried
      # by hand before it's merged.
      opentui:
        applies-to: version-updates
        patterns: ["@opentui/*"]
      packages:
        applies-to: version-updates
        patterns: ["*"]
        exclude-patterns: ["@opentui/*"]
    commit-message:
      prefix: build
      include: scope
  # The docs' site (site/): its own packages, Astro and Starlight, which only build the site.
  - package-ecosystem: bun
    directory: /site
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      site:
        applies-to: version-updates
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
