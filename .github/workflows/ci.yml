name: ci

# GR-D9: the check on every change — what `bun run check` runs, split into jobs CI can run side by side: the lint
# (Biome, the workflows), and the code's checks and tests on Linux and on macOS (slipbox ships for both; on macOS
# its SQLite is Apple's, 14.13); and the terminal tests on each system it ships for (TT-D6). A pull request that
# changes only the docs skips the tests and the terminal tests; the lint job runs the docs' own (D230). Any other runs
# the tests and the terminal checks its files reach (D239, scripts/ci-scope.ts), and so does a push to `dev` or `test`,
# by what changed since that branch's last head. A run by hand runs everything, and calls itself `full`: the check
# `main` takes nothing without (D251). One job, `ci` (`full` by hand), is the required check: it always runs and fails
# unless every job it waits for passed or was skipped. Each job calls package.json's scripts, never commands of its own.
on:
  pull_request:
  push:
    branches: [dev, test]
  # Merge queues need an organisation's repository: listed for later.
  merge_group:
  workflow_dispatch:

# No permission by default; each job grants what it needs, and says why (GR-D9). Every action pinned by its commit,
# a week old when taken (14.10); `bun run check:deps` fails on one that isn't pinned.
permissions: {}

# A pull request's superseded run is cancelled; every other run, a push or a run by hand among them, finishes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # to check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # GR-D11: Bun and the check's tools, at mise.toml's versions, each download checked against mise.lock's sum.
      # mise itself is its newest release a week old, checked against its signed sums; nothing cached, so nothing a
      # pull request saved is restored.
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: false
          minimum_release_age: 7d
      - run: bun install --frozen-lockfile
      # GR-D7: Biome's format and lint, warnings failing.
      - name: biome
        run: bun run lint
      # D235: no source file over 1,500 lines; the few past it capped, only shrinking.
      - name: file sizes
        run: bun run check:size
      # GR-D9: zizmor and actionlint over the workflows and Dependabot's config; zizmor's online audits (an impostor
      # commit, a version comment that lies, an action with a known vulnerability) with this job's token.
      - name: workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run check:actions
      # GR-T6: the Markdown's lint, the spelling and the links between files, over what git tracks.
      - name: docs
        run: bun run check:docs
      # D230: the tests that read the docs, which run here whatever changed, so a pull request of the docs alone,
      # which skips the test job, still has them.
      - name: docs' tests
        run: bun run test:docs

  # D230: what a pull request changed, or a push to `dev` or `test` since the branch's last head. One that touches only
  # the docs (docs/, the blueprint, the site's pages, the Markdown at the top) skips the tests and the terminal tests,
  # which nothing it changes can break. A merge group and a run by hand test everything, as does a diff that can't be
  # read.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # to check out the commit and its base
    outputs:
      code: ${{ steps.scope.outputs.code }}
      checks: ${{ steps.scope.outputs.checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # a pull request's merge commit and its base, or a push's commits since the branch's last head
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: bun
          cache: false
          minimum_release_age: 7d
      - id: scope
        env:
          SCOPE_BEFORE: ${{ github.event.before }}
        run: bun run ci:scope

  test:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    # The suite takes about ten minutes on a 10-core machine; a runner has 3 or 4.
    timeout-minutes: 45
    permissions:
      contents: read # to check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # what a pull request or a push changed: the tests its change reaches
      # Every tool: the docs check's own tests run typos and lychee.
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: false
          minimum_release_age: 7d
      - run: bun install --frozen-lockfile
      - name: typecheck
        run: bun run typecheck
      # Plan 0.3: the core never imports the TUI. This is what keeps the CLI face free of the terminal renderer.
      - name: boundary
        run: bun run check:boundary
      # Plan 14.10: exact versions, the install gates, licences — this platform's OpenTUI package's too — pinned
      # actions.
      - name: dependencies
        run: bun run check:deps
      # A pull request's or a push's: the tests its files reach (D239); a run by hand's, every one.
      - name: tests
        env:
          SCOPE_BEFORE: ${{ github.event.before }}
        run: bun run test:changed

  # TT-D6: the terminal tests — slipbox driven by keys in a headless terminal, read off the screen — on each system
  # slipbox ships for, each runner running a check per core. A failing check's screen is in the job's log.
  terminal:
    needs: changes
    if: ${{ needs.changes.outputs.checks == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    # About five minutes on a 10-core machine, a check per core; a runner has 3 or 4.
    timeout-minutes: 45
    permissions:
      contents: read # to check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # what a pull request or a push changed: the checks its change reaches
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache: false
          minimum_release_age: 7d
      - run: bun install --frozen-lockfile
      - name: terminal tests
        # A pull request's or a push's: the checks its files reach (D239); a run by hand's, every one. A runner is slower
        # than the machine a check was written on: each wait gets at least 30 s (a wait that passes returns at once).
        env:
          SCOPE_BEFORE: ${{ github.event.before }}
          SLIPBOX_TERMINAL_WAIT: "30000"
        run: bun run test:terminal:changed

  # The docs' site (site/), built from docs/ as the pages workflow builds it: every page gathered, every link within it
  # landing. Its own packages, under its own install gates (site/bunfig.toml).
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # to check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: bun
          cache: false
          minimum_release_age: 7d
      - name: site
        run: bun run site

  # The required check (GR-D9): one name, whichever jobs ran. A job skipped by its `if:` counts as passed; one that
  # failed, was cancelled or never started fails this. Run by hand, everything ran: it's `full`, which `main`'s
  # ruleset requires of a commit before it takes it (D251); otherwise `ci`, which `dev`'s requires of a pull request.
  ci:
    name: ${{ github.event_name == 'workflow_dispatch' && 'full' || 'ci' }}
    if: ${{ always() }}
    needs: [lint, changes, test, terminal, site]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped")
            | "\(.key): \(.value.result)"' <<<"$NEEDS")
          if [ -n "$failed" ]; then
            echo "$failed"
            exit 1
          fi
          echo "every job passed or was skipped"
