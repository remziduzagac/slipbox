name: ci

# GR-D9: the check on every change — what `bun run check` runs, split into jobs CI can run side by side: the lint
# (Biome, the workflows), and the code's checks and tests on Linux and macOS (its SQLite is Apple's, 14.13).
# Pushes and full runs also cover terminal checks on each system slipbox ships for (TT-D6). A PR that
# changes only the docs skips unit tests; lint runs the docs' own (D230). Other PRs run reached unit tests (D239).
# Pushes to `dev` or `test` run reached unit and terminal checks (scripts/ci-scope.ts), scoped since the nearest
# complete push pass, without reusing a PR pass that omits terminal checks:
# nothing, for `dev` moved to `test` (CIW-D1–CIW-D3, scripts/ci-range.ts). A run by hand runs everything, and calls
# itself `full`: the check `main` takes nothing without (D251), which it reports again as a commit status, the one
# `main`'s ruleset sees (D257).
# macOS after Linux (D273): each macOS job waits for its Linux job and runs only once that passed. A pull request runs
# them only when it changes what differs on macOS, or carries the `macos` label; every other run, whatever changed.
# Linux's `test` and `terminal` each run in three parts, a runner each, by test file and by check file (D275,
# scripts/ci-shard.ts); macOS's whole, as a part would only wait longer for the account's five macOS runners.
# Each `test` job reports its tests' times, the slowest in its step summary; a test file over its budget fails Linux's,
# and on macOS is a warning (D276, scripts/test-times.ts). It uploads them, `SLOW_TESTS` rewritten from them by hand.
# One job, `ci` (`full` by hand), is the required check: it always runs and fails unless every job it waits for passed
# or was skipped. Each job calls package.json's scripts, never commands of its own.
on:
  # `labeled` too, so the `macos` label added runs the macOS jobs (D273). GitHub starts a run for any label: each runs
  # every job a pull request's run does, since one that skipped them would report `ci` passed.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [dev, test]
  # Merge queues need an organisation's repository: listed for later.
  merge_group:
  workflow_dispatch:

# No permission by default; each job grants what it needs, and says why (GR-D9). Every action pinned by its commit,
# a week old when taken (14.10); `bun run check:deps` fails on one that isn't pinned.
permissions: {}

# A pull request's superseded run is cancelled, and a push's still going when its branch is pushed again: the next
# push's range holds its commits (CIW-D4). A push's run re-run, a run by hand, the full run among them, and a merge
# group's are in groups of their own, never cancelled nor replaced: an older commit's run re-run can't cancel the
# branch's newest.
concurrency:
  group: >-
    ci-${{ github.event.pull_request.number
    || (github.event_name == 'push' && github.run_attempt == '1' && github.ref)
    || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # to check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # GR-D11: Bun and the check's tools, at mise.toml's versions, each download checked against mise.lock's sum.
      # mise itself is its newest release a week old, checked against its signed sums; nothing cached, so nothing a
      # pull request saved is restored.
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: false
          minimum_release_age: 7d
      - run: bun install --frozen-lockfile
      # GR-D7: Biome's format and lint, warnings failing.
      - name: biome
        run: bun run lint
      # D235: no source file over 1,500 lines; the few past it capped, only shrinking.
      - name: file sizes
        run: bun run check:size
      # GR-D9: zizmor and actionlint over the workflows and Dependabot's config; zizmor's online audits (an impostor
      # commit, a version comment that lies, an action with a known vulnerability) with this job's token.
      - name: workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run check:actions
      # GR-T6: the Markdown's lint, the spelling and the links between files, over what git tracks.
      - name: docs
        run: bun run check:docs
      # D230: the tests that read the docs, which run here whatever changed, so a pull request of the docs alone,
      # which skips the test job, still has them.
      - name: docs' tests
        run: bun run test:docs

  # D230: what a pull request changed, or a push to `dev` or `test` over its range: since the nearest commit whose run
  # passed under this scope (CIW-D1, D266), worked out here once and handed to
  # `test` and `terminal` (`range`). One that touches only the docs (docs/, the blueprint, the site's pages, the
  # Markdown at the top) skips the tests and the terminal tests, which nothing it changes can break; a push's range with
  # nothing in it skips them too. A merge group and a run by hand test everything, as does a diff that can't be read.
  # `macos`: whether the macOS jobs run (D273), false only for a pull request that changes nothing `MACOS` lists in
  # scripts/ci-scope.ts and has no `macos` label, which it reads from the event's file as data.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # to check out the commit and its base
      actions: read # for a push, to read the runs that passed and the pull requests' records (CIW-D1, CIW-D2)
    outputs:
      code: ${{ steps.scope.outputs.code }}
      checks: ${{ steps.scope.outputs.checks }}
      macos: ${{ steps.scope.outputs.macos }}
      range: ${{ steps.scope.outputs.range }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # a pull request's merge commit and its base, or a push's history back to the run that passed
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: bun
          cache: false
          minimum_release_age: 7d
      # The token only for a push, which reads the runs: a pull request's code, which runs here, never holds it.
      - id: scope
        env:
          SCOPE_BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.event_name == 'push' && github.token || '' }}
        run: bun run ci:scope

  # On Linux, in three parts by test file (D275): `test (ubuntu-24.04, 2/3)` runs the second third of the tests a change
  # reaches, or of every one, each part about a third of the time; each part runs the typecheck and the gates too, a few
  # seconds. On macOS, `test-macos`, whole, once every part passed (D273).
  test:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        shard: [1/3, 2/3, 3/3]
    runs-on: ${{ matrix.os }}
    # The suite takes about ten minutes on a runner, a part about four.
    timeout-minutes: 45
    permissions:
      contents: read # to check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # what a pull request or a push changed: the tests its change reaches
      # Every tool: the docs check's own tests run typos and lychee.
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: false
          minimum_release_age: 7d
      - run: bun install --frozen-lockfile
      - name: typecheck
        run: bun run typecheck
      # Plan 0.3: the core never imports the TUI. This is what keeps the CLI face free of the terminal renderer.
      - name: boundary
        run: bun run check:boundary
      # Plan 14.10: exact versions, the install gates, licences — this platform's OpenTUI package's too — pinned
      # actions.
      - name: dependencies
        run: bun run check:deps
      # A pull request's or a push's: the tests its files reach (D239), a push's over the range `changes` worked out
      # (CIW-D1); a run by hand's, every one. This part's of them (D275). Their JUnit report in the runner's temporary
      # folder, an empty one when none runs (D276).
      - name: tests
        id: tests
        env:
          SCOPE_RANGE: ${{ needs.changes.outputs.range }}
          SCOPE_SHARD: ${{ matrix.shard }}
          SCOPE_REPORT: ${{ runner.temp }}/test-times.xml
        run: bun run test:changed
      # D276: once the tests ran, passed or failed, their times: the slowest files and tests, here and in the step
      # summary; a test file over its budget fails the job, on macOS a warning (scripts/test-times.ts).
      - name: test times
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: bun run test:times "$RUNNER_TEMP/test-times.xml"
      # The report, for `bun scripts/test-times.ts slow <run>`, which weighs the parts by it: `test-times-Linux-0` to
      # `-2` the parts 1/3 to 3/3, `test-times-macOS-0` macOS's whole. A job run again replaces its own.
      - name: upload test times
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-times-${{ runner.os }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/test-times.xml
          if-no-files-found: warn
          retention-days: 30
          overwrite: true

  # D273: `test` on macOS (arm64, its SQLite Apple's: 14.13), once it passed on Linux: a change that fails there holds
  # none of the five macOS runners the account has at once. A pull request runs it only when `changes` says `macos`;
  # every other run, always. Named as the matrix named it; its steps are `test`'s but the part, which a test holds them
  # to: it runs every test of its scope.
  test-macos:
    name: test (macos-15)
    needs: [changes, test]
    if: ${{ needs.changes.outputs.code == 'true' && needs.changes.outputs.macos == 'true' }}
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read # to check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: false
          minimum_release_age: 7d
      - run: bun install --frozen-lockfile
      - name: typecheck
        run: bun run typecheck
      - name: boundary
        run: bun run check:boundary
      - name: dependencies
        run: bun run check:deps
      - name: tests
        id: tests
        env:
          SCOPE_RANGE: ${{ needs.changes.outputs.range }}
          SCOPE_REPORT: ${{ runner.temp }}/test-times.xml
        run: bun run test:changed
      - name: test times
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: bun run test:times "$RUNNER_TEMP/test-times.xml"
      - name: upload test times
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-times-${{ runner.os }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/test-times.xml
          if-no-files-found: warn
          retention-days: 30
          overwrite: true

  # TT-D6: the terminal tests — slipbox driven by keys in a headless terminal, read off the screen — on each system
  # slipbox ships for, each runner running a check per core. A failing check's screen is in the job's log. On Linux,
  # in three parts on each runner, by check file (D275); on macOS, `terminal-macos`, whole, once every part passed
  # (D273).
  terminal:
    needs: changes
    if: ${{ github.event_name != 'pull_request' && needs.changes.outputs.checks == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        shard: [1/3, 2/3, 3/3]
    runs-on: ${{ matrix.os }}
    # Every check takes about fifteen minutes on a runner, a check per core, a part about six.
    timeout-minutes: 45
    permissions:
      contents: read # to check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # what a pull request or a push changed: the checks its change reaches
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: false
          minimum_release_age: 7d
      - run: bun install --frozen-lockfile
      - name: terminal tests
        # A pull request's or a push's: the checks its files reach (D239), a push's over the range `changes` worked out
        # (CIW-D1); a run by hand's, every one. This part's of them (D275). A runner is slower than the machine a check
        # was written on: each wait gets at least 30 s (a wait that passes returns at once).
        env:
          SCOPE_RANGE: ${{ needs.changes.outputs.range }}
          SCOPE_SHARD: ${{ matrix.shard }}
          SLIPBOX_TERMINAL_WAIT: "30000"
        run: bun run test:terminal:changed

  # D273: `terminal` on macOS, once every part passed on both Linux runners. Never for a pull request (D266), and only
  # when `changes` says `macos`, which every other run does. Named as the matrix named it; its steps are `terminal`'s
  # but the part, which a test holds them to.
  terminal-macos:
    name: terminal (macos-15)
    needs: [changes, terminal]
    if: >-
      ${{ github.event_name != 'pull_request' && needs.changes.outputs.checks == 'true'
      && needs.changes.outputs.macos == 'true' }}
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read # to check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: false
          minimum_release_age: 7d
      - run: bun install --frozen-lockfile
      - name: terminal tests
        env:
          SCOPE_RANGE: ${{ needs.changes.outputs.range }}
          SLIPBOX_TERMINAL_WAIT: "30000"
        run: bun run test:terminal:changed

  # The docs' site (site/), built from docs/ as the pages workflow builds it: every page gathered, every link within it
  # landing. Its own packages, under its own install gates (site/bunfig.toml).
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # to check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: bun
          cache: false
          minimum_release_age: 7d
      - name: site
        run: bun run site

  # The required check (GR-D9): one name, whichever jobs ran. A job skipped by its `if:` counts as passed — a macOS job
  # a pull request doesn't need, or one whose Linux job failed, which fails this itself (D273); one that failed, was
  # cancelled or never started fails this. A job in parts (D275) is one result here, GitHub's for them all: a success
  # only when every part passed, so a part failed or cancelled fails this. Run by hand, everything ran: it's `full`,
  # which `main`'s ruleset requires of a commit before it takes it (D251), as `status` reports it; otherwise `ci`, which
  # `dev`'s and `test`'s require.
  ci:
    name: ${{ github.event_name == 'workflow_dispatch' && 'full' || 'ci' }}
    if: ${{ always() }}
    needs: [lint, changes, test, test-macos, terminal, terminal-macos, site]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped")
            | "\(.key): \(.value.result)"' <<<"$NEEDS")
          if [ -n "$failed" ]; then
            echo "$failed"
            exit 1
          fi
          echo "every job passed or was skipped"

  # D257: run by hand, once every job passed, `full` reported again as a commit status. A ruleset counts no check that a
  # run by hand reports (GitHub's "Troubleshooting required status checks"), so `main`'s never sees the job above; it
  # counts a status this run's token posts, which is GitHub Actions', the source it requires.
  status:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write # to report `full` on the commit, where main's ruleset sees it
    steps:
      - name: full
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=success -f context=full \
            -f description="every job passed" -f target_url="$run"
