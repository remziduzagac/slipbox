name: ci

# GR-D9: the check on every change — what `bun run check` runs, split into jobs CI can run side by side: the lint
# (Biome, the workflows), and the code's checks and tests on Linux and on macOS (slipbox ships for both; on macOS
# its SQLite is Apple's, 14.13); and the terminal tests on each system it ships for (TT-D6). One job, `ci`, is the required check: it always runs and fails unless every job it
# waits for passed or was skipped. Each job calls package.json's scripts, never commands of its own.
on:
  pull_request:
  push:
    branches: [main]
  # Merge queues need an organisation's repository: listed for later.
  merge_group:
  workflow_dispatch:

# No permission by default; each job grants what it needs, and says why (GR-D9). Every action pinned by its commit,
# a week old when taken (14.10); `bun run check:deps` fails on one that isn't pinned.
permissions: {}

# A pull request's superseded run is cancelled; every other run, a push to main among them, finishes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # to check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # GR-D11: Bun and the check's tools, at mise.toml's versions, each download checked against mise.lock's sum.
      # mise itself is its newest release a week old, checked against its signed sums; nothing cached, so nothing a
      # pull request saved is restored.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: false
          minimum_release_age: 7d
      - run: bun install --frozen-lockfile
      # GR-D7: Biome's format and lint, warnings failing.
      - name: biome
        run: bun run lint
      # GR-D9: zizmor and actionlint over the workflows and Dependabot's config; zizmor's online audits (an impostor
      # commit, a version comment that lies, an action with a known vulnerability) with this job's token.
      - name: workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run check:actions
      # GR-T6: the Markdown's lint, the spelling and the links between files, over what git tracks.
      - name: docs
        run: bun run check:docs

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    # The suite takes about ten minutes on a 10-core machine; a runner has 3 or 4.
    timeout-minutes: 45
    permissions:
      contents: read # to check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every tool: the docs check's own tests run typos and lychee.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: false
          minimum_release_age: 7d
      - run: bun install --frozen-lockfile
      - name: typecheck
        run: bun run typecheck
      # Plan 0.3: the core never imports the TUI. This is what keeps the CLI face free of the terminal renderer.
      - name: boundary
        run: bun run check:boundary
      # Plan 14.10: exact versions, the install gates, licences — this platform's OpenTUI package's too — pinned
      # actions.
      - name: dependencies
        run: bun run check:deps
      - name: tests
        run: bun run test

  # TT-D6: the terminal tests — slipbox driven by keys in a headless terminal, read off the screen — on each system
  # slipbox ships for, each runner running a check per core. A failing check's screen is in the job's log.
  terminal:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    # About five minutes on a 10-core machine, a check per core; a runner has 3 or 4.
    timeout-minutes: 45
    permissions:
      contents: read # to check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: false
          minimum_release_age: 7d
      - run: bun install --frozen-lockfile
      - name: terminal tests
        run: bun run test:terminal

  # The required check (GR-D9): one name, whichever jobs ran. A job skipped by its `if:` counts as passed; one that
  # failed, was cancelled or never started fails this.
  ci:
    if: ${{ always() }}
    needs: [lint, test, terminal]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped")
            | "\(.key): \(.value.result)"' <<<"$NEEDS")
          if [ -n "$failed" ]; then
            echo "$failed"
            exit 1
          fi
          echo "every job passed or was skipped"
