name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: typecheck
        run: bun run typecheck
      # Plan 0.3: the core never imports the TUI. This is what keeps the CLI face free of the terminal renderer.
      - name: boundary
        run: bun run check:boundary
      - name: tests
        run: bun test
