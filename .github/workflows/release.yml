name: release

# Plan 14.2: a tag v<version> pushed is built by build.yml — the build a preview shares (GR-D13): each platform on a
# runner of its own after the tests pass there, each pack's SBOM attested to it, the packs summed and attested — then
# the release drafted with its notes from CHANGELOG.md: nothing is published until a person publishes the draft.
# Publishing it runs homebrew.yml and pages.yml. Every action pinned by its commit, a week old when taken (14.10);
# values reach the shell through env, never inline.
on:
  push:
    tags: ["v*"]

# No permission by default; each job grants what it needs, and says why (GR-D9). No concurrency group: a release run
# is never cancelled. No cache is restored anywhere in it: a cache can be written by a pull request's run.
permissions: {}

jobs:
  # Before anything is built: the tag is the version's (package.json's and src/version.ts's), and the changelog has
  # its section, which the draft's notes are made from.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # to check out the code
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: bun
          cache: false
          minimum_release_age: 7d
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          bun --no-install scripts/release.ts notes --tag "$TAG" >/dev/null
          echo "version=${TAG#v}" >>"$GITHUB_OUTPUT"

  # A reusable workflow named `./`, read from this run's own commit, never from the workspace. zizmor asks for GitHub's
  # newer `$/`, which means the same; actionlint 1.7.12 doesn't read it yet (rhysd/actionlint#711), and checks this
  # call's inputs and permissions against build.yml only in this form.
  build:
    needs: plan
    uses: ./.github/workflows/build.yml # zizmor: ignore[self-repository]
    # The most build.yml's jobs may have; each takes only its own share.
    permissions:
      contents: read # to check out the code
      id-token: write # to sign the attestations, with a certificate for the workflow (Sigstore)
      attestations: write # to store them with the repository's attestations
    with:
      tag: ${{ github.ref_name }}
      version: ${{ needs.plan.outputs.version }}
      # The whole suite on every platform released, the Intel Mac and ARM Linux among them, before anything is built.
      suite: true

  # The draft, from build.yml's `release` artifact: the packs, their SBOMs, `SHA256SUMS`, `install.sh` and
  # `slipbox.rb`, each attested already. Nothing built runs here.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # to draft the release and upload its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: bun
          cache: false
          minimum_release_age: 7d
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist/release
      - name: notes
        env:
          TAG: ${{ github.ref_name }}
        run: bun --no-install scripts/release.ts notes --tag "$TAG" >"$RUNNER_TEMP/notes.md"
      - name: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "slipbox ${TAG#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" dist/release/*
