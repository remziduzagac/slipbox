name: release

# Plan 14.2: a tag v<version> pushed builds each platform on a runner of its own — where its OpenTUI package is
# installed, and a Mac's binary is signed by Bun on a Mac — after the whole check passes there. Then the packs are
# summed and attested, and the release drafted: nothing is published until a person publishes the draft. Every
# action pinned by its commit, a week old when taken (14.10); values reach the shell through env, never inline.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: check
        run: bun run check
      - name: build
        env:
          TARGET: ${{ matrix.target }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: bun scripts/release.ts build --target "$TARGET" --repo "$REPO" --tag "$TAG"
      # Bun signs a Mac's binary ad hoc; one whose signature is broken isn't run at all (14.13).
      - name: signature
        if: startsWith(matrix.target, 'darwin-')
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p unpacked
          tar -xzf "dist/release/slipbox-${TAG#v}-$TARGET.tar.gz" -C unpacked
          codesign --verify --verbose "unpacked/slipbox-${TAG#v}-$TARGET/slipbox"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pack-${{ matrix.target }}
          path: dist/release/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pack-*
          path: dist/release
          merge-multiple: true
      - name: finish
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: bun scripts/release.ts finish --repo "$REPO" --tag "$TAG"
      # Who built each pack, from which commit, by which workflow: `gh attestation verify <pack> --repo <owner/name>`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/release/*.tar.gz
      - name: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --draft --verify-tag --title "slipbox ${TAG#v}" dist/release/*
