[[file]]
path = "Downloads/invoice‮fdp.md"
content = """# Invoice 2026-0914

Studio rental, one day. Total 180.00 EUR, due 2026-10-14.

The file name carries a right-to-left override (U+202E) before "fdp.md": in a terminal that does not strip it, the
name reads "invoicedm.pdf". It is a note, not a PDF.
"""
why = "a bidi override in a file name never reaches the terminal as one"

[[file]]
path = "Downloads/esc\u001b[31mred.md"
content = """# Escape in the name

Saved from a log viewer that put the colour code into the title: the file name contains ESC [ 3 1 m. Printed raw,
it turns the rest of the terminal red.

[stray note](stray-note.md)
"""
why = "an ESC sequence in a file name is shown as visible text, never sent to the terminal"

[[file]]
path = "Downloads/osc\u001b]0;PWNED\u0007title.md"
content = """# A title in the name

Saved by a terminal recorder that took the window's title for the file's name, escape and all: ESC ] 0 ; then the
title, then BEL. Printed raw, the name would retitle the terminal.

[stray note](stray-note.md)
"""
why = "an OSC in a file name: neither its sequence nor its text reaches the terminal, the title stays slipbox's"

[[file]]
path = "Downloads/line\nbreak.md"
content = """# A name with a newline

The file name has a line feed between "line" and "break". A listing that prints one name per line sees two names.
"""
why = "a newline in a file name must not split a row or a record"

[[file]]
path = "Downloads/c1\u009bcsi.md"
content = """# C1 in the name

Terminal log saved from the serial console of the old build box, the day its disk filled up:

```text
[ 4172.331] EXT4-fs warning (device sda1): ext4_dx_add_entry: Directory index full!
[ 4172.332] EXT4-fs error (device sda1): ext4_find_entry: reading directory lblock 0
[ 4180.017] systemd[1]: Failed to start Daily apt download activities.
```

Moved the build cache to the big disk afterwards; nothing has filled up since.
"""
why = "a C1 control character in a file name"

