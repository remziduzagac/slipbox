[[file]]
path = "notes/-dash.md"
content = """# A file that starts with a dash

Made by an export script that named the note after a bullet. Every tool that takes a file name has to be told it is
a name and not an option: `read -- -dash`, `cat ./-dash.md`.

It links to [the index](index.md), which is how most notes get found in the first place.
"""
why = "a name that begins with a dash is read after --, and never taken for a flag"

[[file]]
path = "notes/--flag.md"
content = """# --flag

Two dashes this time. The file is named like a long option (`--flag`), which is the version of the mistake that
actually bit me: `rm --flag.md` is an error about a flag, not a deletion.

Back to [the inbox](inbox.md).
"""
why = "a name shaped like a long option"

[[file]]
path = "notes/Caf\u00E9.md"
content = """# Café (NFC)

The café on the corner of Kyoto's Karasuma street, with the é as one character (U+00E9), which is how macOS Finder
and most editors save it. See also [the NFD twin](Café.md), written with a combining accent.

I keep both on purpose: the same name typed two ways is two different files on Linux and one on macOS.
"""
why = "NFC and NFD file names that look identical: two notes, one displayed name"

[[file]]
path = "notes/Cafe\u0301.md"
content = """# Café (NFD)

The same café with the é as e followed by a combining acute (U+0065 U+0301), which is how an old rsync from a Mac
leaves it. The other one is [the NFC twin](Café.md).

Searching for "cafe" in my notes finds both, which is the only way I notice the second one exists.
"""
why = "the decomposed twin of Café.md"

[[file]]
path = "notes/🚲 ride.md"
content = """# 🚲 ride

