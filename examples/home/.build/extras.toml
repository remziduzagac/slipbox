# Files that can't be committed to this repository, or that a checkout can't carry: made by scripts/build-home.ts in
# the built copy of home/. Format: README.md, "The build". Each entry says where it goes and why.

# ---------------------------------------------------------------------------------------------------------------
# notes/: symlinks in and out of the root, names that begin with a dash, Unicode names, a big and an unreadable note
# ---------------------------------------------------------------------------------------------------------------

