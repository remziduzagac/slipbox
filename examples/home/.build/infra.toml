"k8s/sync-worker.yaml" = '''
---
# yaml-language-server: $schema=../schemas/kestrel-worker.json
# The sync worker: drains the op queue for the offline sync.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kestrel-sync-worker
  namespace: kestrel
  labels:
    app: kestrel-sync-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kestrel-sync-worker
  template:
    metadata:
      labels:
        app: kestrel-sync-worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/kestrel-labs/kestrel-sync-worker:2.3.0
          envFrom:
            - configMapRef:
                name: kestrel-sync-worker-config
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kestrel-sync-worker
  namespace: kestrel
spec:
  selector:
    app: kestrel-sync-worker
  ports:
    - name: http
      port: 80
      targetPort: 8090
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kestrel-sync-worker-config
  namespace: kestrel
data:
  QUEUE_URL: redis://cache.kestrel.internal:6379/1
  SYNC_DEPTH_ALERT: "5000"
'''

