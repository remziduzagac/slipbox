"docs/adr/0001-offline-first-sync.md" = '''
# ADR 1: Offline-first sync with an op log

- Status: accepted
- Date: 2026-01-20
- Deciders: Priya Nair, Sam Rivera, Aiko Tanaka

## Context

Cyclists plan routes on a train, in a basement flat, in a field. A planner that stops working when the network
does is not much of a planner. The 1.x apps stored routes on the server and cached the last response; two devices
editing the same route overwrote each other, and nobody could say which edit had won.

We want every edit to work with no network and to arrive on the other devices later, in order, without losing either
person's work.

## Decision

Every edit on a device is written first to a local **op log** (IndexedDB in the web app). A sync loop sends the
log to the server in batches and applies the server's ops back. The details of the loop, the queue and the conflict
rules are in [the sync document](../sync.md); the rest of the system is in [the architecture](../architecture.md).

Ops are small and idempotent: each has a ULID, the device that made it and a payload. The server stores them in
`sync_ops` and applies them in ULID order. Two ops that touch the same field are resolved by the later ULID; the
loser is kept in the log so a human can look.

## Consequences[^1]

- Edits never block on the network. The UI always reads from the local store.
- The server is no longer the source of truth for what the user sees right now, only for what every device will
  eventually see.
- We need a queue, a retry policy and a way to see that the queue is stuck. The first version had none of the last.
- Support questions change from "why did it not save" to "why did it not arrive".

### Alternatives considered

- **CRDTs everywhere.** Right for text, heavy for a route that is a list of waypoints. We use last-writer-wins on
  fields and keep the loser.
- **Server-first with a cache.** What 1.x did. It is exactly the thing we are leaving.

[^1]: This list is a summary. Aiko's longer write-up is in the notes.
'''
"docs/architecture.md" = '''
# Architecture

How Kestrel fits together, from the browser to the database. Terms in italics are in the
[glossary](/docs/glossary-terms.md). Decisions behind the shape are in [ADR 1](adr/0001-offline-first-sync.md) (sync)
and [ADR 2](/docs/adr/0002-route-engine-in-rust.md) (the engine).

## Components

| Component | Where | Language | Job |
| --- | --- | --- | --- |
| Web app | `src/` | TypeScript | the map, route editing, the local store |
| API | `api/` | Python | accounts, routes, shares, the server side of sync |
| Route engine | `crates/route-engine/` | Rust | A* search, edge costs |
| Tiles | `crates/tiles/` | Rust | tile maths and the tile server |
| Worker | `api/` | Python | emails, cleanup, parked-op reports |
| Database | `db/schema.sql` | Postgres | everything durable |

The API's own README, with how to run it and where the OpenAPI spec lives, is [here](../api/README.md). The route
engine's manifest is [/crates/route-engine/Cargo.toml](/crates/route-engine/Cargo.toml).

## Data flow

A route edit takes this path. The web app writes the edit to its local op log first and shows it at once. The sync
loop sends the log to the API. The API stores the ops and tells the other devices. Planning a route is a different
path: the web app asks the API, the API runs the engine and returns a polyline.

```mermaid
flowchart LR
    Browser[Web app] -->|ops| API
    Browser -->|plan route| API
    API -->|search| Engine[Route engine]
    API --> DB[(Postgres)]
    API -->|pub/sub| Redis
    Redis --> Worker
    Worker --> DB
    Browser -->|tiles| Tiles
```

## Where things live

- The **op log** is in IndexedDB on the device, and in `sync_ops` on the server. How it is drained is in
  [sync.md](sync.md).
- **Share links** are signed by the API with a secret from the environment, and verified on every view; see
  [route sharing](features/route-sharing.md).
- **Config** is `kestrel.toml` for the app and `config/` for environments. The shape is `config/schema.json`.

## Moving this repository

Everything above refers to paths from the root of this repository: `/docs/glossary-terms.md`, `/crates/...`. If the
repository moves, those links keep working inside it, and the few that leave it do not. The ones that leave:

- Sam's design notes for the sync rewrite live outside the repo, in
  [sync-rewrite](../../../notes/projects/sync-rewrite.md) in his notes.
- The Kubernetes manifests for the workers are in the infra repository (`slipbox://infra/k8s/sync-worker.yaml`).

## Reading order

1. This page.
2. [sync.md](sync.md), if you work on the client or the queue.
3. The ADRs, in order.
4. The runbooks, before your first on-call week.
'''
