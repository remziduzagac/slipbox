"src/sync/retry.ts" = '''
// Retry and backoff policy for the sync queue, with a budget per op.
// The server mirrors this in api/kestrel_api/sync.py (retry_after); keep the two in step.
// Decision: ../../docs/adr/0004-retry-budget.md

import { decorrelated, type Jitter } from "./backoff";

export interface RetryPolicy {
  jitter: Jitter;
  budget: number;
}

export const DEFAULT_POLICY: RetryPolicy = {
  jitter: { base: 500, cap: 60_000 },
  budget: 5,
};

export type Verdict = "retry" | "park" | "drop";

/** What to do with an op the server answered with `status`, after `attempt` tries. */
export function verdict(attempt: number, status: number, p: RetryPolicy = DEFAULT_POLICY): Verdict {
  if (status === 404 || status === 410) return "drop";
  if (status === 409) return "park";
  if (attempt >= p.budget) return "park";
  return status === 0 || status === 429 || status >= 500 ? "retry" : "park";
}

export async function withRetry<T>(fn: () => Promise<T>, p: RetryPolicy = DEFAULT_POLICY): Promise<T> {
  let attempt = 0;
  let wait = p.jitter.base;
  for (;;) {
    try {
      return await fn();
    } catch (err) {
      const status = (err as { status?: number }).status ?? 0;
      if (verdict(attempt++, status, p) !== "retry") throw err;
      wait = decorrelated(wait, p.jitter);
      await new Promise((r) => setTimeout(r, wait));
    }
  }
}
'''
"src/sync/backoff.ts" = '''
// Decorrelated jitter backoff, used by retry.ts.
export interface Jitter {
  base: number;
  cap: number;
}

export function decorrelated(prev: number, j: Jitter): number {
  const next = Math.random() * (prev * 3 - j.base) + j.base;
  return Math.min(j.cap, next);
}

export function schedule(j: Jitter, attempts: number): number[] {
  const out: number[] = [];
  let prev = j.base;
  for (let i = 0; i < attempts; i++) {
    prev = decorrelated(prev, j);
    out.push(prev);
  }
  return out;
}
'''

