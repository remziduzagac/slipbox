"docs/runbooks/retry-budget.md" = '''
# Runbook: tuning the retry budget

The budget is `sync.retry_budget` in `kestrel.toml`: five attempts by default. Use this page when support reports
many "spent" ops after a bad hour on the server, and before you change the number.

## Check first

1. Is the server healthy? See [the queue runbook](sync-queue.md).
2. How many ops are spent, and since when? The admin tool has the count; the log line is `op spent`.
3. Were they all one error? One 409 in a loop is a bug in a client; many 503s are a server problem the budget should
   have survived.

## Change the number

Raise it only for a known outage, and put it back afterwards. A higher budget means a bad op holds the queue longer,
which is what [ADR 4](../adr/0004-retry-budget.md) was written to stop.

| Situation | Budget | Why |
| --- | --- | --- |
| normal | 5 | about thirty seconds of trying |
| known server outage | 8 | rides out a few minutes |
| debugging one device | 1 | parks at once, so the op can be read |
'''

