`okrs/q4-draft.md`; it was renamed when the numbers were final. Scores are updated every Friday, 0.0 to 1.0, and
anything below 0.4 at week six gets a conversation. The [roadmap](../roadmap/q4.md) says when each piece lands.

Jump to: [Key results](#key-results), [O1: Ship route sharing (2.3)](#o1-ship-route-sharing-23),
[O2: Offline that earns trust](#o2-offline-that-earns-trust), [What we dropped](#what-we-dropped).

## Key results

