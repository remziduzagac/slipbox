# Release plan: Kestrel 2.3

**Release manager:** Jo Becker · **Engineering lead:** Aiko Tanaka · **Date:** 2026-09-30

Customer-facing text is in [the release notes](2.3-notes.md). The engineering changelog is
[CHANGELOG.md in the app repository](slipbox://kestrel/CHANGELOG.md).

## Dates

| Date | What | Owner |
| --- | --- | --- |
| 2026-09-14 | Feature freeze, internal dogfood starts | Aiko |
| 2026-09-22 | 10% rollout of sharing | Priya |
| 2026-09-26 | Release candidate on TestFlight and the Play beta | Aiko |
| 2026-09-28 | Release notes draft | Jo |
| 2026-09-30 | Everyone, web and Android | Priya |
| 2026-10-03 | iOS after review | Aiko |

## Checklist

- [x] Feature freeze
- [ ] Migration of the old sync queue tested on 40 real devices
  - [ ] Android 12 to 15
    - [ ] Pixel
      - [ ] Pixel 6 (low storage)
      - [ ] Pixel 8
    - [ ] Samsung
  - [ ] iOS 17 and 18
- [ ] Share link analytics reviewed
- [ ] Release notes read by Sam
- [ ] Status page text for the iOS delay
- [ ] Support macros updated

## Order of work on release day

1. [ ] Merge the release branch
2. [ ] Tag `v2.3.0`
3. [ ] Deploy the API (the migration runs first)
4. [ ] Raise rollout to 100% on Android
   1. [ ] 25%
   2. [ ] 50%
   3. [ ] 100%
5. [ ] Turn off the v1 sync endpoint (after 14 days)
   1. [ ] Announce the date in the status page text
   2. [ ] Stop accepting v1 requests
   3. [ ] Remove the v1 handlers from the API
6. [ ] Post in #releases

## Rollout

| Stage | Share of riders | Hold for | Rollback if |
| --- | ---: | --- | --- |
| Dogfood | staff | 5 days | any lost change |
| Canary | 1% | 1 day | crash rate over 0.5% |
| Early | 10% | 2 days | stalled queues over 0.1% |
| Half | 50% | 1 day | support tickets double |
| All | 100% | none | n/a |

## Risks

The migration of the old queue is the part most likely to hurt a rider, so the plan holds the 10% stage until the
stalled-queue rate is below 0.1%.
'''


