"prd/offline-sync.md" = '''
# PRD: offline sync v2

<!-- markdownlint-disable MD013 -->

| ID | Requirement | Description | Status |
| ---: | :--- | --- | :---: |
| R1 | Local-first queue | Every edit a rider makes while offline is written to a durable on-device queue first and shown in the UI immediately, never held in memory. | in progress |
| R2 | Ordered replay | When the network returns, queued changes are sent in the order they were made, and a change that depends on an earlier one is never sent before it. | in progress |
| R3 | Retry budget | A failed send is retried with exponential back-off and jitter, up to a budget of six attempts in ten minutes, after which the queue pauses and says so. | in review |
| R4 | Conflict rule | When two devices changed the same route, the later edit to each field wins, and the earlier value is kept in the route's history for thirty days. | in progress |
| R5 | Visible state | The app shows one of four states at all times (synced, pending, offline, stalled) with a count of waiting changes and the time of the last good sync. | in progress |
| R6 | Stall detection | A queue that has not drained for fifteen minutes while the network is up counts as stalled, raises the banner and reports to the server without waiting. | planned |
| R7 | Safe upgrade | Riders on 2.2 with unsent changes keep them: the first launch of 2.3 migrates the old queue file before anything is sent, or does nothing at all. | in progress |
| R8 | Data cap | The queue holds at most 5,000 changes or 50 MB, whichever comes first; beyond that the oldest GPS traces are thinned, never the route edits. | dropped |

<!-- markdownlint-enable MD013 -->

## Problem

> "I rode four hours through the hills with no signal and when I got home half my edits had vanished. I did not know
> whether to trust it again." (Interview P3, 2026-08-19)

The v1 sync sent changes in a single request when it noticed a connection. A request that failed was dropped, and the
rider was never told. Support saw it in 31 tickets between June and August, the largest single cause of "lost route"
reports.

## Goals

- Zero silent losses: every change is either synced or visibly pending (R1, R5).
- A stalled queue is noticed by the app within fifteen minutes, not by a customer in a ticket (R6).
- At least 99.5% of queued changes reach the server within five minutes of the network coming back.

Non-goals: real-time collaboration, and syncing the map tiles themselves (tiles have their own cache).

<!-- markdownlint-disable MD013 -->

## When a device reconnects after a long period without signal, the retry budget pauses the queue after six failed attempts, reports the pause to the server at once and resumes in the order the edits were made, never dropping or reordering one

<!-- markdownlint-enable MD013 -->

The retry budget (R3) is the part with the most argument. Six attempts in ten minutes is a guess based on how the v1
worker behaves, which retries without a limit and can fill the queue; Aiko wants it configurable per region, Malik
wants it fixed. We ship fixed and revisit with data. ^retry-budget

## Design notes

The client keeps the queue in SQLite, and the worker drains it with this loop:

```ts
async function drain(queue: Queue, send: (c: Change) => Promise<void>): Promise<DrainResult> {
  let attempts = 0;
  for (const change of queue.pending()) {
    while (true) {
      try { await send(change); queue.ack(change.id); break; }
      catch (err) { if (++attempts > BUDGET) return { paused: true }; await backoff(attempts); }
    }
  }
  return { paused: false };
}
```

See the engineering write-up in [the sync doc](slipbox://kestrel/docs/sync.md) for the server side.

### Pending state names

The states are written exactly as they appear in the app:

> **synced** every change is on the server.
> **pending** some changes are waiting; the count is shown.
> **offline** no network; changes are being queued.
> **stalled** the network is up but the queue is not draining.

<!-- markdownlint-disable MD013 -->

### SyncQueueDrainPausedAfterRetryBudgetExhaustedEventV2PayloadForRegionalWorkerReplayAuditAndStalledBannerTelemetryExportRecord

<!-- markdownlint-enable MD013 -->

The event the worker logs when R3's budget runs out, spelled as it appears in the sync logs.

## Rollout

Staged over three weeks from 2026-09-09, tied to the 2.3 release; the plan and owners are in the Q4 roadmap under
[route sharing and offline sync](../roadmap/q4.md). A change of the retry budget is a config flip, not a release.

## Metrics

| Measure | Baseline (Aug) | Target | Now (Oct 5) |
| --- | ---: | ---: | ---: |
| Silent losses per week | 7 | 0 | 0 |
| Queue drain, p95 (minutes) | 38 | 5 | 6.2 |
| "Lost route" tickets per week | 11 | 2 | 3 |
| Riders with a stalled queue | not measured | < 0.1% | 0.04% |

## Open questions

- Should a paused queue ask the rider to retry, or retry on its own when the app is next opened? Owner: Tomás.
- Do we thin GPS traces at all before the data cap is back on the table? Owner: Aiko.
'''
"prd/route-sharing.md" = '''
# PRD: route sharing

**Status:** draft, in review · **Owner:** Sam Rivera · **Design:** Tomás Ruiz · **Engineering:** Aiko

> [!NOTE]
> This PRD is the record of what we decide before building. The metrics table below gets its results once 2.3 has
> shipped.

## Problem

Riders plan a route and then describe it to their friends in a chat message: a screenshot, a place name, "we turn left
at the church". Three of the ten riders we interviewed in August did exactly that, and two of them said their friends
then planned a different route and arrived somewhere else.

> "I made the perfect loop, sent a screenshot, and my brother rode the other way round. It was fine, but it was not
> the loop." (P2)

The research that led here will be in [the September synthesis](/research/synthesis-2026-09.md); the quarter's plan
for it is under [route sharing in the Q4 roadmap](../roadmap/q4.md#route-sharing).

## Goals

- A rider can send a route as a link in under ten seconds from the route card.
- Someone without the app sees the route, read-only, in a browser, without signing in.
- A rider with the app can open the link and save the route to their own library in two taps.
- Shared links expire after 30 days unless the owner renews them.

## Non-goals

- Editing a route together. That is a 2027 theme.
- Public discovery of routes: a link is private to whoever has it.
- Sharing rides (what you did) as opposed to routes (what you plan); rides have a different privacy model.

## User stories

- [ ] As a rider, I tap **Share** on a route card and get a link.
- [ ] As a rider, I copy the link with one tap and see that it was copied.
- [ ] As a friend without the app, I open the link and see the route on a map.
- [ ] As a friend with the app, I open the link and the app shows the route with a **Save** button.
- [ ] As a rider, I see who opened my link. (Not decided.)
- [ ] As a rider, I can turn a link off before it expires.

## Metrics

| Measure | Baseline | Target |
| --- | ---: | ---: |
| Routes shared per active rider per month | 0.0 | 0.6 |
| Links opened by non-members | n/a | 30% |
| Non-member to sign-up within 7 days | n/a | 8% |
| Support tickets about sharing | n/a | < 5/week |

## Notes for engineering

> [!TIP]
> A link in a chat app shows a preview card. Make sure the route's name and distance are in the page title.

> [!IMPORTANT]
> A shared link exposes the route's start point. For routes starting at someone's home, offer to trim the first 200 m.

> [!WARNING]
> Links must not be guessable. The short code is 10 characters from a 32-letter alphabet, and the server rate-limits
> lookups.

> [!CAUTION]
> Do not log the full link in the app's analytics: the code is a credential for the route.

> [!faq]- What happens to a link when the route is deleted?
> The link keeps working for seven days with a banner saying the owner removed the route, then returns a 410.

> [!question]+ Should viewers see the owner's name?
> Current design says no, only "Shared by a Kestrel rider". Jo hears the opposite from customers who share with clubs.

<!-- markdownlint-disable-next-line MD013 -->
> [!tip] Test the preview card in the three chat apps riders named most often before raising the rollout past 10%
> Jo has the list from the interviews; the card's title and image are what people judge it by.

## Review comments

Pasted from the design review thread, as written:

> Priya: we agreed in review that
> [!note] means the banner, not the sheet.

> [!] still open: who renews?

> [ !note] from the design crit, pasted as is

## Open questions

- Who can renew a link, the owner only or anyone with edit rights on the route? Owner: Tomás.
- Does a link opened in the in-app browser of a chat app count as a non-member visit? Owner: Malik.
- Is 30 days right? The median rider plans a trip about three weeks ahead, so a link made for it could expire the week
  before the trip. Owner: Sam.

## Implementation

The decision on link format is recorded as [ADR 0003](slipbox://kestrel/docs/adr/0003-sharing-links.md). The engineering
view, with the endpoints and the data model, is in
[the feature doc](../../kestrel/docs/features/route-sharing.md) in the app repository, which is a sibling checkout of
this one.

### Rollout

1. Internal dogfood from 2026-09-14.
2. 10% of riders from 2026-09-22.
3. Everyone with 2.3 on 2026-09-30.
   1. Android and web first.
   2. iOS after review.
'''

