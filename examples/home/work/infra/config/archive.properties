# Settings for the nightly archive job (kestrel-archive, runs on the bastion at 02:30).
# Java properties: key=value or key: value. The older copy on the bastion, legacy-archive.properties, still
# uses '!' comments and continuation lines; this one is what the job reads now.

# Where the archive goes
archive.target.bucket = kestrel-archive-eu
archive.target.prefix = nightly/${date}
archive.target.storage-class = GLACIER_IR

# What goes into it. One path to a key; the job reads archive.sources.0, .1 and so on in order.
archive.sources.0 = /var/lib/kestrel/routes
archive.sources.1 = /var/lib/kestrel/gpx-uploads
archive.sources.2 = /var/lib/kestrel/offline-bundles
archive.sources.3 = /var/lib/kestrel/exports

archive.exclude.patterns = *.tmp,*.part,.DS_Store

# Retention, in days
archive.retention.days = 400
archive.retention.legal-hold = false

# Notification text; the \u escapes are what the template tool wants for the non-ASCII characters
archive.notify.subject = Kestrel archive — finished
archive.notify.footer = Sent by the bastion · Zürich time
archive.notify.recipients = infra@kestrel.dev
archive.notify.on-failure = pager:oncall

archive.db.url = jdbc:postgresql://db.kestrel.internal:5432/kestrel_archive
archive.db.pool.size = 4
archive.db.pool.timeout-ms = 30000
