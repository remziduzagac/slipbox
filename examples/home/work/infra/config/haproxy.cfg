# Load balancer settings for the bastion's HAProxy, rendered into haproxy.conf at deploy time.
# Kept as .cfg so the generator can read it as sections of key = value.

[global]
maxconn = 20000                  ; per process
log = /dev/log
user = haproxy
tune.ssl.default-dh-param = 2048 ; 2048 is plenty for the staging certificates
stats_socket = /run/haproxy/admin.sock

[defaults]
mode = http
timeout_connect = 5s
timeout_client = 30s
timeout_server = 30s
retries = 3
option = httplog

# the public listener
[frontend https_in]
bind = *:443
certs = /etc/ssl/kestrel/
acl_api = hdr(host) -i api.kestrel.dev
acl_tiles = hdr(host) -i tiles.kestrel.dev
use_backend = api if acl_api

[backend api]
balance = leastconn
health_url = https://api.kestrel.dev/healthz#ready
server_a = 10.20.4.11:8080 check
server_b = 10.20.4.12:8080 check
; server_c = 10.20.4.13:8080 check   taken out for the kernel upgrade, back on the 28th

[backend tiles]
balance = roundrobin
server_a = 10.20.5.21:8081 check
stats_uri = /stats#overview
