# The copy of the archive job's settings that is still on the old bastion, from before the move.
# Java properties: key=value or key: value, '#' and '!' both start a comment.

! Where the archive goes
archive.target.bucket = kestrel-archive-eu
archive.target.prefix = nightly/${date}
archive.target.storage-class = STANDARD_IA

! What goes into it. One long list, kept readable with continuations.
archive.sources = /var/lib/kestrel/routes, \
    /var/lib/kestrel/gpx-uploads, \
    /var/lib/kestrel/offline-bundles, \
    /var/lib/kestrel/exports

archive.exclude.patterns = *.tmp, *.part, \
    .DS_Store

# Retention, in days
archive.retention.days = 365
archive.retention.legal-hold = false

! Notification text
archive.notify.subject = Kestrel archive — finished
archive.notify.recipients = infra@kestrel.dev
