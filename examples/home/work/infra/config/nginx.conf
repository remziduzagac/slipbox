# nginx on the old bastion, kept only until the HAProxy move is finished
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    server {
        listen 80;
        server_name bastion.kestrel.internal;

        location /healthz {
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
        }
    }
}
