# The team's recommended slipbox settings: every key once, with a value you may well want to change.
# Copy to ~/.config/slipbox/config.toml (see README.md), then delete what you don't care about.
# A key that is absent takes slipbox's default, so a short file is a fine file.

theme = "kestrel-dark"          # our own, in themes/kestrel-dark.yaml; slipbox's built-ins work too

[render]
inset = 3
max_width = 110                 # the text column in the TUI; 0 would be the full pane
glyphs = "unicode"              # our terminal font has no Nerd glyphs
show_urls = "always"
code = "document"               # code opens as a document (24.x) where its language is mapped
code_cells = "box"              # the code view's cells in boxes, or on bands
code_wrap = "scroll"            # a code block too wide scrolls sideways (our trees and logs keep their columns)
images = "auto"                 # pictures in notes, where the terminal draws them
images_remote = "ask"           # pictures online: asked for on enter
mermaid = "picture"             # diagrams as pictures where the terminal draws them; text elsewhere
math = "text"                   # a display's maths as Unicode text

[walk]
extensions = ["md", "markdown", "mdx"]
exclude = ["drafts/", "*.bak", "node_modules/"]
max_file_size = 8388608         # 8 MiB: the GPX exports are big
root_markers = [".git", ".slipbox", ".obsidian", ".zk", "book.toml"]   # book.toml: our mdBook docs count as roots

[links]                         # the links slipbox makes, said outright rather than found from each root
style = "markdown"              # mdBook reads no wikilinks
path = "relative"               # a link that still works on GitHub and in the book
extension = "keep"              # mdBook turns foo.md into foo.html; a link without .md breaks there

[files]
show = "all"                    # every text file; ctrl+n with a name like deploy.toml or run.py makes that file
include = ["*.ts", "scripts/"]
exclude = ["*.lock", "dist/"]

[ui]
sidebar = false                 # opened with the rail's button when I want it
sidebar_width = 36
outline = true
outline_width = 36
split_ratio = 0.6
top_bar = false
lines = "heavy"
breadcrumb = false
left_rail = false
right_rail = false
mouse = false
narrow_width = 110
restore_session = false         # I like starting clean
cursorline = false
line_numbers = true
relative_numbers = "lens"       # the lens's counters, each row's distance from the cursor's
wrap = false
readable_width = true
readable_max = 88
zen = true
scrolloff = 5
history_limit = 250

[input]
leader = "\\"                   # the key `leader` means below; backslash, because nothing else uses it
which_key = true
which_key_delay_ms = 300

[trust]
roots = ["~/work/kestrel", "~/work/infra"]   # the team's own repositories: their tools run as they would anywhere

[capture]
location = "vault"
file = "inbox/scratch.md"
open_in = "right"                # beside the note, not floating over it

[git]
base = "release"
signs = true                    # changed lines in the gutter, against what's staged
signs_at = "gutter_left"        # before the line numbers, away from the text
bases = ["main", "release"]     # a branch made from release is measured against it, not main
worktrees = "~/work/worktrees/{repo}/{branch}" # the agents' worktrees in one folder, not beside each repository

[search]
engine = "index"

[index]
background = false
idle_seconds = 60

[diagnostics]
bar = "on"
marks = false
severity = "info"

[lsp]
enabled = true
auto_install = false            # the laptops have the servers from Homebrew

[types.memory]                  # my agents' memory files: what they must say
paths = ["**/memory/*.md"]
required = ["name", "description", "metadata.type"]
values = { "metadata.type" = ["user", "feedback", "project", "reference"] }

[update]
check = false                   # the laptops are updated from the fleet's own mirror, not by each one asking

[language-server.pyright]
command = "/opt/homebrew/bin/pyright-langserver"   # the program is mine to name, never a folder's
args = ["--stdio"]
environment = { PYTHONPATH = "api" }
config = { python = { analysis = { typeCheckingMode = "strict", autoSearchPaths = true } } }

[language-server.fake-lsp]      # the fake server slipbox's own tests use, to see problems without a real one
command = "bun"
args = ["tests/fixtures/fake-lsp.ts"]
config = { fake = { greeting = "hello from the kestrel config" } }

[[language]]
name = "python"
language-servers = ["pyright", { name = "ruff", only-features = ["diagnostics", "format"] }]
linters = ["todo"]

[[language]]
name = "fake"
file-types = ["fake"]
language-servers = ["fake-lsp"]
roots = [".git"]
language-id = "fake"

[linter.todo]                   # a linter without a server: what the notes and code still owe
lint-command = "rg --vimgrep -e TODO -e FIXME"
lint-stdin = false
lint-formats = ['%f:%l:%c:%m']        # rg --vimgrep: no space after the column
lint-source = "todo"
lint-severity = 3
lint-ignore-exit-code = true
root-markers = [".git"]
require-marker = false

[context]
depth = 2
backlinks = false
limit = 40

[editor]
command = "nvim +{line} {file}"
autosave_ms = 10000
edit_in = "live"
lens_min_rows = 8
lens_max = 0.4
auto_pairs = true                # typing ( [ { " ' ` puts its closing half after the cursor
remote = [                      # run in order, each after the last; the first failure stops
  "nvim --server {server} --remote {file}",
  "nvim --server {server} --remote-send '<C-\\><C-N>:{line}<CR>'",
]

[spell]                         # misspelt words marked in notes (25.6)
enabled = true
languages = ["en", "tr"]        # a note's own lang: in its front matter wins
dictionaries = { de = "~/.local/share/hunspell/de_DE.dic" }   # yours, by language: its .aff beside it

[lint]
enabled = "on"
command = ["markdownlint-cli2", "--config", "~/.markdownlint-cli2.jsonc"]

[watch]
enabled = true
debounce_ms = 200
poll_ms = 5000

[colors]                        # a role in each form
tree_guide = "#3b4261"          # a string: the foreground
pane_title = { fg = "#8c95b0", bold = true }
scrollbar = 244                 # a terminal palette number
scrollbar_track = "236"
border = "ansi:8"
rail = { bg = "default" }
lens = { fg = "#e0af68", italic = true, underline = false }
breadcrumb_band = { bg = "#1d1e2b", dim = true }
h1 = { fg = "#7aa2f7" }

[colors.kestrel-dark]           # the roles we tune by hand, only while our theme is active
h1 = { fg = "#7aa2f7", bold = true }
h2 = { fg = "#e0af68", bold = true }
h3 = { fg = "#9ece6a", bold = true }
strong = { fg = "#e6ebf8", bold = true }
emphasis = { fg = "#c9d1e8", italic = true }
strike = { fg = "#5b627b" }
code_inline = { fg = "#e6ebf8", bg = "#262a38", italic = true }
code_block = { fg = "#c9d1e8", bg = "#1b1e28" }
link = { fg = "#7aa2f7", underline = true }
link_unresolved = { fg = "#f7768e", underline = true }
link_ambiguous = { fg = "#ff9e64", underline = true }
wikilink = "#7dcfff"
embed = "#c0956b"
quote = { fg = "#8c95b0", italic = true }
footnote = "#bb9af7"
tag = "#bb9af7"
check_done = "#9ece6a"
check_todo = "#e0af68"
syn_keyword = "#bb9af7"
syn_function = "#7aa2f7"
syn_string = "#9ece6a"
syn_number = "#ff9e64"
syn_comment = { fg = "#5b627b", italic = true }
syn_type = "#e0af68"
error = { fg = "#f7768e", bold = true }
tree_guide = "#3b4261"

[colors.nord]                   # only while the nord theme is active
link = "#88c0d0"
link_unresolved = { fg = "#bf616a", underline = true }
topbar_chip = { fg = "#2e3440", bg = "#88c0d0", bold = true }

[colors.mono]
sidebar_vault = { bold = true, underline = true }

