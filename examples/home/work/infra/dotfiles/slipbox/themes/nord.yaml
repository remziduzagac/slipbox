# Our copy of Nord with the comments made readable. Same name as the built-in one on purpose:
# the file in ~/.config/slipbox/themes/ should win over the built-in.
name: "nord"
author: "Aiko Tanaka"
variant: "dark"

palette:
  base00: "#2e3440"
  base01: "#3b4252"
  base02: "#434c5e"
  base03: "#7b88a1"   # Nord's own #4c566a is too dark on our monitors
  base04: "#d8dee9"
  base05: "#e5e9f0"
  base06: "#eceff4"
  base07: "#8fbcbb"
  base08: "#bf616a"
  base09: "#d08770"
  base0A: "#ebcb8b"
  base0B: "#a3be8c"
  base0C: "#88c0d0"
  base0D: "#81a1c1"
  base0E: "#b48ead"
  base0F: "#5e81ac"
