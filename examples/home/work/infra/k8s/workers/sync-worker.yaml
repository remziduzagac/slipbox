---
# yaml-language-server: $schema=../schemas/kestrel-worker.json
# The sync worker. Moved from k8s/sync-worker.yaml on 2026-09-23, with the other workers, the day after
# the queue stalled (docs/runbooks/sync-queue.md in the kestrel repository).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kestrel-sync-worker
  namespace: kestrel
  labels:
    app: kestrel-sync-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: kestrel-sync-worker
  template:
    metadata:
      labels:
        app: kestrel-sync-worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/kestrel-labs/kestrel-sync-worker:2.3.0
          envFrom:
            - configMapRef:
                name: kestrel-sync-worker-config
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kestrel-sync-worker
  namespace: kestrel
spec:
  selector:
    app: kestrel-sync-worker
  ports:
    - name: http
      port: 80
      targetPort: 8090
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kestrel-sync-worker-config
  namespace: kestrel
data:
  QUEUE_URL: redis://cache.kestrel.internal:6379/1
  SYNC_RETRY_BUDGET: "5"
  SYNC_BACKOFF_MAX_SECONDS: "60"
  SYNC_STALL_ALERT_SECONDS: "600"
