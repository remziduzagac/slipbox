[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kestrel-api"
version = "2.3.0"
description = "The Kestrel API: routes, shares and offline sync"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "pyright>=1.1.370"]

[tool.setuptools.packages.find]
include = ["kestrel_api*"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["scripts/migrate_v1.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["kestrel_api"]
exclude = ["scripts", "**/half_written.py"]
typeCheckingMode = "standard"
pythonVersion = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["slow: needs a local Redis"]
testpaths = ["tests"]
