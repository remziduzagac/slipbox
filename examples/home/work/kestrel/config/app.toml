# Per-environment overrides. Read after base.yaml; later values win.
# The chain: kestrel.toml -> this file -> base.yaml -> schema.json

include  = "base.yaml"                     # relative to this file
extends  = "../kestrel.toml"
schema   = "./missing-schema.json"         # TODO: generated by `make docs`; not committed yet
includes = ["/config/base.yaml", "regions.yaml"]   # "/" is the repository's root

environment = "development"

[sync]
enabled          = true            # offline-first since 2.3
interval_seconds = 30
max_batch        = 50              # ops per request; the server caps at 500
# read by api/kestrel_api/sync.py and src/sync/queue.ts; keep the backoff in step with src/sync/retry.ts
backoff          = "exponential"
backoff_base_ms  = 500
backoff_max_ms   = 60_000
park_on_conflict = true            # the 409 fix of 2.3.0: park the op, go on
queue_file       = "tmp/sync-queue.json"
runbook          = "../docs/runbooks/sync-queue.md"

[editor]
# How the docs open in an editor from the app's "edit this page" link.
command = "nvim"
args    = ["--server", "{server}", "--remote", "{file}"]
file    = "docs/dev-setup.md"
path    = "docs/"
line    = 1
# the zeitgeber of the whole setup is the 08:00 standup; nothing here depends on it
open_in_split = false

[types]
# one of every kind a TOML value can be
integer   = 42
negative  = -17
hex       = 0xDEADBEEF
float     = 3.14159
exponent  = 6.02e23
infinite  = inf
boolean   = true
string    = "a basic string with an \"escape\" and a tab\t"
literal   = 'C:\Users\kestrel\no-escapes'
multiline = """
Two lines,
the second ending in a backslash-newline \
so they join."""
datetime  = 2026-09-30T09:00:00+02:00
local_dt  = 2026-09-30T09:00:00
date      = 2026-09-30
time      = 09:00:00
array     = [1, 2, 3]
mixed     = ["a", 1, true]
table     = { x = 1, y = 2 }

[logging]
level  = "info"        # debug | info | warn
format = "json"
file   = "tmp/kestrel.log"
