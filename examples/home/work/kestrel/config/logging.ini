; Logging for the API, read by our own loader (kestrel_api/logconf.py), not by logging.config.
# a hash comment is fine here as well
log_to_stdout = true
debug
colour: auto
motd = ""

[loggers]
keys = root, kestrel, sync   ; the loggers that exist

[handlers]
keys=console,file

[logger_root]
level = INFO
handlers = console

[logger_kestrel]
level = DEBUG        ; trailing semicolon comment
handlers = console,file
qualname = kestrel
propagate: 0

[handler_file]
class = handlers.RotatingFileHandler
args = ('tmp/kestrel.log', 'a', 10485760, 5)   # 10 MB, five files
formatter = plain

[formatter_plain]
format = "%(asctime)s #%(process)d %(levelname)s %(name)s: %(message)s"   # the hash in quotes is not a comment
datefmt = %Y-%m-%dT%H:%M:%S
password_hint = 'not a secret ; just a hint'