# Legacy settings from before the YAML move. The syntax is TOML; the extension is a habit from the old deploy tool.
title = "kestrel legacy settings"
port = 8080

[server]
host = "0.0.0.0"
workers = 4

[server.tls]
enabled = true
cert = "/etc/ssl/kestrel.pem"

[server.tls.ciphers]
min_version = "1.2"

[database]
pool = 10
url = "postgres://kestrel@localhost/kestrel"
