[package]
name = "route-engine"
version = "0.9.0"
edition = "2021"
description = "A* route search over the Kestrel segment graph"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiles = { path = "../tiles" }

[dev-dependencies]
criterion = "0.5"

[build-dependencies]
cc = "1"

[[bin]]
name = "route-bench"
path = "src/main.rs"

[features]
default = ["elevation"]
elevation = []
offline-tables = ["serde/rc"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
debug = true
