# Aster's mount controller (a .cfg in INI form). Values from the March 2026 pointing run:
# see ../logs/observing-log-2026.md, "Aster pointing model".

[mount]
model = EQ8-R Pro
latitude = 61.442
longitude = 10.917
elevation_m = 812
park_alt = 0
park_az = 180

[limits]
horizon_deg = 12
meridian_flip_min = 15
slew_rate = 4.0

[pointing.model]
terms = IH, ID, CH, NP, MA, ME, TF
rms_arcsec = 18.4
fitted = 2026-03-01

[guiding]
camera = ASI174MM-mini
exposure_s = 2
aggressiveness_ra = 70
aggressiveness_dec = 100
