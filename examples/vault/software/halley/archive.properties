# The stacks archive's Java indexer (archive.jar) reads this at start-up.
# key=value and key: value both work in a .properties file.
archive.root=/srv/stacks
archive.index.path=/srv/stacks/.index
archive.index.rebuild.cron=0 5 * * SUN
archive.thumbnails.enabled=true
archive.thumbnails.sizes: 256, 1024
archive.retention.days=400
archive.docs: ../pipeline-cookbook.md
http.port=8421
http.cors.origins=https://halden-ridge.invalid
